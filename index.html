<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1b1d19">
  <meta name="description" content="Materi edukasi K3 di bengkel: kenali bahaya, pilih APD, terapkan kebiasaan aman, dan uji pemahaman">
  <title>K3 di Bengkel | Ruang Belajar Keselamatan Kerja</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;600;700;800;900&family=Bricolage+Grotesque:opsz,wght@12..96,400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --charcoal: #1b1d19;
      --charcoal-2: #252821;
      --ink: #242620;
      --paper: #f1efe7;
      --paper-2: #e5e2d8;
      --cement: #c8c7bc;
      --muted: #72756b;
      --line: rgba(36, 38, 32, .2);
      --line-light: rgba(241, 239, 231, .2);
      --safety: #f3c928;
      --safety-dark: #c29b00;
      --danger: #b83b2d;
      --success: #356c4e;
      --display: "Big Shoulders Display", Impact, sans-serif;
      --body: "Bricolage Grotesque", "Trebuchet MS", sans-serif;
      --mono: "IBM Plex Mono", "Courier New", monospace;
      --content: 1240px;
      --header-h: 78px;
      --ease: cubic-bezier(.22,.72,.2,1);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; scroll-padding-top: calc(var(--header-h) + 20px); }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--body); line-height: 1.55; }
    body::before {
      content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 100;
      opacity: .045; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.35'/%3E%3C/svg%3E");
    }
    img { display: block; max-width: 100%; }
    figure { margin: 0; }
    a { color: inherit; text-decoration: none; }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible {
      outline: 3px solid var(--safety-dark); outline-offset: 3px;
    }
    ::selection { background: var(--safety); color: var(--charcoal); }
    .container { width: min(var(--content), calc(100% - 56px)); margin-inline: auto; }
    .mono, .eyebrow, .micro-label, .nav-link, .tag, .risk-pill, .index-number { font-family: var(--mono); text-transform: uppercase; letter-spacing: .08em; }
    .eyebrow { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: .72rem; font-weight: 600; }
    .eyebrow::before { content: ""; width: 26px; height: 3px; background: var(--safety-dark); display: inline-block; }
    .display { font-family: var(--display); font-weight: 800; text-transform: uppercase; line-height: .9; letter-spacing: -.025em; }
    .section-heading { display: flex; align-items: end; justify-content: space-between; gap: 32px; margin-bottom: 34px; }
    .section-heading h2 { margin: 12px 0 0; font-family: var(--display); text-transform: uppercase; font-size: clamp(2.6rem, 5.6vw, 5.3rem); line-height: .9; letter-spacing: -.02em; }
    .section-heading p { max-width: 420px; margin: 0; color: #5c5e55; }
    .section { padding: 88px 0; }
    .section-dark { background: var(--charcoal); color: var(--paper); }
    .section-dark .eyebrow, .section-dark .section-heading p { color: #b7b8ad; }
    .section-dark .eyebrow::before { background: var(--safety); }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 12px;
      border: 1px solid var(--ink); padding: 13px 18px; background: transparent; color: var(--ink);
      font-family: var(--mono); font-size: .74rem; font-weight: 600; letter-spacing: .05em; text-transform: uppercase;
      transition: background .22s var(--ease), color .22s var(--ease), border-color .22s var(--ease), transform .22s var(--ease);
    }
    .btn:hover { background: var(--ink); color: var(--paper); transform: translateY(-2px); }
    .btn-primary { background: var(--safety); border-color: var(--safety); color: var(--charcoal); }
    .btn-primary:hover { background: var(--charcoal); border-color: var(--charcoal); color: var(--safety); }
    .btn-light { border-color: var(--paper); color: var(--paper); }
    .btn-light:hover { background: var(--paper); color: var(--charcoal); }
    .btn-small { padding: 9px 12px; font-size: .68rem; }
    .icon { width: 18px; height: 18px; display: inline-block; flex: 0 0 auto; }
    .hazard-stripe { height: 7px; background: repeating-linear-gradient(135deg, var(--safety) 0 10px, var(--charcoal) 10px 20px); }
    .rule { height: 1px; background: var(--line); }

    /* Header and navigation */
    .site-header {
      position: fixed; z-index: 80; inset: 0 0 auto; height: var(--header-h);
      background: rgba(27, 29, 25, .96); color: var(--paper);
      border-bottom: 1px solid var(--line-light); backdrop-filter: blur(8px);
    }
    .header-inner { height: 100%; width: min(1480px, calc(100% - 56px)); margin: auto; display: flex; align-items: center; justify-content: space-between; gap: 24px; }
    .brand { display: inline-flex; align-items: center; gap: 12px; min-width: 210px; }
    .brand-mark { width: 34px; height: 34px; border: 1px solid var(--safety); display: grid; place-items: center; color: var(--safety); }
    .brand-copy { display: flex; flex-direction: column; line-height: 1.05; }
    .brand-copy strong { font-family: var(--display); font-size: 1.4rem; font-weight: 800; letter-spacing: .03em; }
    .brand-copy span { color: #bfc0b5; font-family: var(--mono); font-size: .58rem; letter-spacing: .09em; margin-top: 4px; }
    .nav { display: flex; align-items: center; gap: clamp(12px, 1.5vw, 24px); }
    .nav-link { position: relative; padding: 29px 0 26px; font-size: .65rem; color: #c8c9be; white-space: nowrap; transition: color .2s ease; }
    .nav-link::after { content: ""; position: absolute; bottom: 0; left: 0; width: 100%; height: 3px; background: var(--safety); transform: scaleX(0); transform-origin: left; transition: transform .25s var(--ease); }
    .nav-link:hover, .nav-link.active { color: var(--paper); }
    .nav-link.active::after { transform: scaleX(1); }
    .mobile-menu-toggle { display: none; border: 1px solid var(--line-light); color: var(--paper); background: transparent; padding: 10px; }
    .mobile-menu-toggle svg { width: 20px; height: 20px; display: block; }

    /* Local image and graceful placeholder */
    .image-frame { position: relative; overflow: hidden; aspect-ratio: var(--ratio, 16 / 9); background: #d5d3c8; isolation: isolate; }
    .image-frame > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform .65s var(--ease); }
    .image-frame:hover > img { transform: scale(1.025); }
    .image-frame.is-missing > img { display: none; }
    .image-placeholder {
      position: absolute; inset: 0; display: flex; flex-direction: column; align-items: flex-start; justify-content: flex-end;
      padding: 18px; color: #45483e; background:
        linear-gradient(135deg, transparent 0 48%, rgba(36,38,32,.06) 48% 49%, transparent 49% 100%),
        repeating-linear-gradient(0deg, rgba(36,38,32,.025) 0 1px, transparent 1px 5px),
        #d5d3c8;
    }
    .image-placeholder::before { content: "FOTO BELUM DIISI"; position: absolute; top: 16px; left: 18px; font: 600 .62rem var(--mono); letter-spacing: .1em; }
    .placeholder-file { font: 600 .75rem var(--mono); overflow-wrap: anywhere; }
    .placeholder-size { margin-top: 5px; font-size: .75rem; color: #66685f; }
    .image-frame:not(.is-missing) .image-placeholder { display: none; }

    /* Home hero */
    .hero { min-height: 100svh; height: 850px; max-height: 1120px; position: relative; overflow: hidden; background: var(--charcoal); color: var(--paper); }
    .hero-stage { position: absolute; inset: 0; overflow: hidden; touch-action: pan-y; }
    .hero-slide { position: absolute; inset: 0; opacity: 0; visibility: hidden; transition: opacity 1.1s ease, visibility 1.1s; }
    .hero-slide.active { opacity: 1; visibility: visible; }
    .hero-slide .image-frame { width: 100%; height: 100%; aspect-ratio: auto; background: #30332c; }
    .hero-slide .image-frame > img { filter: brightness(.45) saturate(.72); }
    .hero-slide .image-placeholder { background: #34372f; color: #c4c5ba; }
    .hero-slide .placeholder-size { color: #a8aa9f; }
    .hero-stage::after { content: ""; position: absolute; z-index: 2; inset: 0; pointer-events: none; background: linear-gradient(90deg, rgba(18,20,17,.66), transparent 65%), linear-gradient(0deg, rgba(18,20,17,.82), transparent 58%); }
    .hero-content { position: relative; z-index: 3; height: 100%; width: min(1480px, calc(100% - 56px)); margin: auto; display: flex; flex-direction: column; justify-content: flex-end; padding: 130px 0 76px; }
    .hero-topline { display: flex; align-items: center; gap: 12px; color: var(--safety); font: 600 .72rem var(--mono); letter-spacing: .12em; text-transform: uppercase; }
    .hero-topline::before { content: ""; width: 38px; height: 2px; background: var(--safety); }
    .hero-title { margin: 18px 0 0 -7px; font-family: var(--display); font-size: clamp(11rem, 30vw, 28rem); line-height: .68; letter-spacing: -.055em; font-weight: 900; }
    .hero-title span { color: var(--safety); }
    .hero-bottom { display: flex; align-items: end; justify-content: space-between; gap: 28px; margin-top: 34px; }
    .hero-side-note { max-width: 250px; color: #c9c9bf; font-size: .82rem; }
    .hero-side-note strong { display: block; color: var(--paper); font-family: var(--mono); font-size: .68rem; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 8px; }
    .hero-callout { width: min(360px, 40%); padding: 23px 24px; color: var(--charcoal); background: var(--safety); border-left: 5px solid var(--paper); }
    .hero-callout p { margin: 0 0 16px; font-size: 1.05rem; font-weight: 700; line-height: 1.3; }
    .hero-callout .btn { border-color: var(--charcoal); }
    .hero-callout .btn:hover { background: var(--charcoal); color: var(--safety); }
    .hero-controls { position: absolute; z-index: 5; bottom: 27px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 13px; }
    .hero-arrow { display: grid; place-items: center; width: 36px; height: 36px; color: var(--paper); background: transparent; border: 1px solid rgba(241,239,231,.5); transition: background .2s ease, color .2s ease; }
    .hero-arrow:hover { background: var(--safety); color: var(--charcoal); border-color: var(--safety); }
    .hero-dots { display: flex; align-items: center; gap: 7px; }
    .hero-dot { width: 7px; height: 7px; border: 0; padding: 0; border-radius: 50%; background: #999b91; }
    .hero-dot.active { width: 24px; border-radius: 8px; background: var(--safety); }
    .home-intro { padding: 92px 0 102px; }
    .topic-grid { display: grid; grid-template-columns: 1.1fr 1fr 1fr; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    .topic-lead { padding: 28px 26px 28px 0; }
    .topic-lead h2 { margin: 14px 0; font: 800 clamp(2.7rem, 5vw, 4.7rem)/.86 var(--display); text-transform: uppercase; }
    .topic-lead p { color: var(--muted); max-width: 300px; }
    .topic-link { min-height: 210px; padding: 26px; border-left: 1px solid var(--line); display: flex; flex-direction: column; justify-content: space-between; transition: background .25s ease; }
    .topic-link:hover { background: var(--safety); }
    .topic-link .topic-num { font: 500 .7rem var(--mono); color: var(--muted); }
    .topic-link h3 { margin: 20px 0 8px; font: 700 2rem/.95 var(--display); text-transform: uppercase; }
    .topic-link p { margin: 0; color: #5c5e55; font-size: .88rem; }
    .topic-link .arrow { align-self: end; margin-top: 18px; }

    /* Standard content pages */
    .page-shell { min-height: 100vh; padding-top: var(--header-h); }
    .page { animation: pageIn .45s var(--ease) both; }
    @keyframes pageIn { from { opacity: 0; transform: translateY(9px); } to { opacity: 1; transform: translateY(0); } }
    .page-hero { background: var(--paper-2); padding: 70px 0 62px; border-bottom: 1px solid var(--line); }
    .page-hero-inner { display: grid; grid-template-columns: 1fr minmax(230px, 360px); align-items: end; gap: 48px; }
    .page-hero h1 { margin: 17px 0 0; max-width: 900px; font: 800 clamp(3.5rem, 8vw, 8rem)/.82 var(--display); text-transform: uppercase; letter-spacing: -.03em; }
    .page-hero h1 em { font-style: normal; color: var(--safety-dark); }
    .page-hero p { margin: 0; color: #5c5e55; max-width: 360px; }
    .page-body { padding: 70px 0 92px; }
    .lead-grid { display: grid; grid-template-columns: .75fr 1.25fr; gap: clamp(30px, 7vw, 100px); align-items: start; }
    .big-number { color: var(--safety-dark); font: 800 clamp(5rem, 12vw, 11rem)/.75 var(--display); letter-spacing: -.05em; }
    .lead-copy h2 { margin: 0 0 20px; font: 700 clamp(2rem, 3.8vw, 3.4rem)/.95 var(--display); text-transform: uppercase; }
    .lead-copy p { max-width: 760px; font-size: 1.05rem; color: #505249; }
    .definition-strip { display: grid; grid-template-columns: repeat(3, 1fr); margin-top: 58px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    .definition-item { padding: 24px 25px 28px 0; }
    .definition-item + .definition-item { border-left: 1px solid var(--line); padding-left: 25px; }
    .definition-item .tag { font-size: .67rem; color: var(--safety-dark); }
    .definition-item h3 { margin: 10px 0; font: 700 1.75rem/.95 var(--display); text-transform: uppercase; }
    .definition-item p { margin: 0; color: #62645b; font-size: .9rem; }
    .legal-list { list-style: none; padding: 0; margin: 26px 0 0; border-top: 1px solid var(--line); }
    .legal-list li { display: grid; grid-template-columns: 160px 1fr; gap: 24px; padding: 19px 0; border-bottom: 1px solid var(--line); }
    .legal-list strong { font: 600 .72rem var(--mono); text-transform: uppercase; color: var(--safety-dark); }
    .legal-list span { max-width: 780px; }

    /* Importance comparison */
    .impact-layout { display: grid; grid-template-columns: .82fr 1.18fr; gap: 56px; align-items: start; }
    .impact-list { border-top: 1px solid var(--line); }
    .impact-row { display: grid; grid-template-columns: 44px 1fr; gap: 16px; padding: 19px 0; border-bottom: 1px solid var(--line); }
    .impact-row .impact-index { color: var(--safety-dark); font: 600 .72rem var(--mono); padding-top: 4px; }
    .impact-row h3 { margin: 0 0 5px; font: 700 1.65rem/.95 var(--display); text-transform: uppercase; }
    .impact-row p { margin: 0; color: #5c5e55; font-size: .9rem; }
    .comparison { --split: 50%; }
    .comparison-stage { position: relative; aspect-ratio: 4 / 3; overflow: hidden; background: #d5d3c8; }
    .comparison-stage .image-frame { position: absolute; inset: 0; width: 100%; height: 100%; aspect-ratio: auto; }
    .comparison-stage .image-frame > img { object-fit: cover; }
    .comparison-top { position: absolute; inset: 0; clip-path: inset(0 calc(100% - var(--split)) 0 0); z-index: 2; }
    .comparison-top .image-frame > img { filter: saturate(.55) brightness(.82); }
    .comparison-divider { position: absolute; z-index: 4; top: 0; bottom: 0; left: var(--split); width: 3px; background: var(--safety); transform: translateX(-50%); pointer-events: none; }
    .comparison-divider::after { content: "↔"; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); display: grid; place-items: center; width: 38px; height: 38px; background: var(--safety); color: var(--charcoal); border: 2px solid var(--charcoal); font-size: 1.1rem; }
    .comparison-label { position: absolute; z-index: 5; top: 14px; padding: 7px 10px; background: var(--charcoal); color: var(--paper); font: 600 .62rem var(--mono); letter-spacing: .06em; text-transform: uppercase; }
    .comparison-label.left { left: 14px; }
    .comparison-label.right { right: 14px; background: var(--safety); color: var(--charcoal); }
    .comparison input[type=range] { display: block; width: 100%; margin: 19px 0 10px; accent-color: var(--safety-dark); cursor: ew-resize; }
    .comparison-caption { display: flex; justify-content: space-between; gap: 20px; color: var(--muted); font: 500 .64rem var(--mono); text-transform: uppercase; }

    /* Hazards and hotspots */
    .hotspot-layout { display: grid; grid-template-columns: 1.15fr .85fr; gap: 40px; align-items: start; }
    .hotspot-stage { aspect-ratio: 4 / 3; background: #b8b7ab; }
    .hotspot-stage .image-placeholder { padding: 22px; }
    .hotspot-stage .image-placeholder::before { top: 20px; }
    .hotspot-stage > img { object-fit: cover; }
    .hotspot-button {
      position: absolute; z-index: 4; left: var(--x); top: var(--y); transform: translate(-50%,-50%);
      display: grid; place-items: center; width: 36px; height: 36px; padding: 0;
      border-radius: 50%; border: 2px solid var(--paper); color: var(--charcoal); background: var(--safety);
      box-shadow: 0 0 0 5px rgba(243,201,40,.22); font: 600 .68rem var(--mono);
      transition: transform .2s ease, background .2s ease;
    }
    .hotspot-button:hover, .hotspot-button.active { transform: translate(-50%,-50%) scale(1.15); background: var(--charcoal); color: var(--safety); }
    .hotspot-caption { display: flex; justify-content: space-between; gap: 20px; margin-top: 12px; color: var(--muted); font: 500 .63rem var(--mono); text-transform: uppercase; }
    .hotspot-detail { min-height: 290px; padding: 27px; border: 1px solid var(--line); background: #e8e6dc; }
    .hotspot-detail h3 { margin: 13px 0 10px; font: 800 2.5rem/.9 var(--display); text-transform: uppercase; }
    .hotspot-detail p { margin: 0; color: #57594f; }
    .hotspot-detail .detail-risk { margin-top: 18px; }
    .risk-pill { display: inline-flex; align-items: center; gap: 7px; padding: 5px 8px; font-size: .6rem; font-weight: 600; background: #dedbd0; color: var(--ink); }
    .risk-pill::before { content: ""; width: 7px; height: 7px; display: inline-block; background: var(--cement); }
    .risk-pill.kritis { background: #f4d5cf; color: #7e241b; }
    .risk-pill.kritis::before { background: var(--danger); }
    .risk-pill.tinggi { background: #f7e6bc; color: #795d00; }
    .risk-pill.tinggi::before { background: #d59d00; }
    .risk-pill.sedang { background: #d8e6da; color: #2f6345; }
    .risk-pill.sedang::before { background: var(--success); }
    .hazard-filter { display: flex; flex-wrap: wrap; gap: 8px; margin: 50px 0 18px; }
    .filter-btn { padding: 9px 12px; border: 1px solid var(--line); background: transparent; color: var(--ink); font: 600 .65rem var(--mono); text-transform: uppercase; }
    .filter-btn:hover, .filter-btn.active { background: var(--charcoal); color: var(--paper); border-color: var(--charcoal); }
    .hazard-list { border-top: 1px solid var(--line); }
    .hazard-entry { border-bottom: 1px solid var(--line); }
    .hazard-entry[hidden] { display: none; }
    .hazard-entry summary { list-style: none; display: grid; grid-template-columns: 42px minmax(0,1fr) auto 24px; align-items: center; gap: 16px; padding: 20px 0; cursor: pointer; }
    .hazard-entry summary::-webkit-details-marker { display: none; }
    .hazard-entry .hazard-num { color: var(--muted); font: 500 .72rem var(--mono); }
    .hazard-entry summary strong { font: 700 clamp(1.3rem, 2.3vw, 1.8rem)/.95 var(--display); text-transform: uppercase; }
    .hazard-entry .summary-plus { font-size: 1.3rem; transition: transform .2s ease; }
    .hazard-entry[open] .summary-plus { transform: rotate(45deg); }
    .hazard-detail-grid { display: grid; grid-template-columns: minmax(220px,.7fr) 1.3fr; gap: 28px; padding: 0 0 28px 58px; }
    .hazard-detail-grid .image-frame { align-self: start; }
    .hazard-copy { display: grid; grid-template-columns: 1fr 1fr; gap: 18px 26px; }
    .hazard-copy h4 { margin: 0 0 5px; font: 600 .65rem var(--mono); text-transform: uppercase; color: var(--safety-dark); }
    .hazard-copy p { margin: 0; font-size: .86rem; color: #5b5d54; }

    /* APD */
    .apd-intro { display: grid; grid-template-columns: .75fr 1.25fr; gap: 54px; align-items: start; margin-bottom: 44px; }
    .apd-intro p { margin: 0; max-width: 760px; color: #55574e; font-size: 1.05rem; }
    .apd-grid { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); }
    .apd-card { display: flex; flex-direction: column; text-align: left; padding: 0; border: 0; background: var(--paper); color: var(--ink); transition: background .2s ease; }
    .apd-card:hover, .apd-card.active { background: #e4e0d2; }
    .apd-card.active { box-shadow: inset 0 -5px var(--safety-dark); }
    .apd-card .image-frame { width: 100%; --ratio: 5 / 4; }
    .apd-card-copy { padding: 16px 16px 19px; }
    .apd-card-copy .apd-num { font: 500 .62rem var(--mono); color: var(--muted); }
    .apd-card-copy h3 { margin: 8px 0 0; font: 700 1.45rem/.95 var(--display); text-transform: uppercase; }
    .apd-detail { display: grid; grid-template-columns: .55fr 1.45fr; gap: 36px; padding: 30px; background: var(--charcoal); color: var(--paper); margin-top: 1px; }
    .apd-detail h3 { margin: 0; font: 800 clamp(2rem,4vw,3.4rem)/.9 var(--display); text-transform: uppercase; }
    .apd-detail .eyebrow { color: #b9bbae; }
    .apd-detail .eyebrow::before { background: var(--safety); }
    .apd-detail-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 22px; }
    .apd-detail-grid h4 { margin: 0 0 8px; color: var(--safety); font: 600 .65rem var(--mono); text-transform: uppercase; }
    .apd-detail-grid p { margin: 0; color: #d0d0c6; font-size: .86rem; }
    .game-section { margin-top: 82px; }
    .game-board { display: grid; grid-template-columns: .8fr 1.2fr; gap: 0; border: 1px solid var(--line); }
    .game-intro { background: var(--safety); padding: 30px; }

        targets.forEach(el => el.classList.add("is-visible"));
        return;
      }
      const observer = new IntersectionObserver(entries => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add("is-visible");
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: .12 });
      targets.forEach(el => observer.observe(el));
    }

        </div>
        <div class="section" style="padding-bottom:0"><div class="section-heading reveal"><div><div class="eyebrow">Jika keadaan darurat</div><h2>Utamakan<br>keselamatan</h2></div><p>Jangan bertindak di luar kemampuan. Aktifkan prosedur darurat, beri tahu penanggung jawab, dan hubungi layanan darurat setempat bila diperlukan.</p></div>
          <div class="emergency-grid reveal">
            <article class="emergency-card"><span class="tag">01 / APAR</span><h3>Metode PASS</h3><ol><li><b>Pull:</b> tarik pin pengaman.</li><li><b>Aim:</b> arahkan ke pangkal api.</li><li><b>Squeeze:</b> tekan tuas.</li><li><b>Sweep:</b> sapukan dari sisi ke sisi.</li></ol><div class="notice">Gunakan APAR hanya jika api masih kecil, jenis APAR sesuai, kamu terlatih, dan jalur keluar tetap aman. Jika api membesar atau asap menghalangi, evakuasi segera.</div></article>
            <article class="emergency-card"><span class="tag">02 / P3K</span><h3>Luka ringan</h3><ol><li>Pastikan lokasi aman dan gunakan sarung tangan bila tersedia.</li><li>Untuk luka kecil, bilas dengan air bersih dan tekan dengan kasa bersih untuk menghentikan perdarahan.</li><li>Tutup dengan balutan bersih. Cari bantuan medis untuk luka dalam, benda tertancap, perdarahan berat, atau tanda infeksi.</li></ol></article>
            <article class="emergency-card"><span class="tag">03 / LISTRIK</span><h3>Sengatan listrik</h3><ol><li>Jangan menyentuh korban selama masih terhubung dengan arus.</li><li>Putuskan sumber listrik jika dapat dilakukan dengan aman dan panggil bantuan darurat.</li><li>Setelah area aman, periksa respons dan napas. Lakukan CPR/AED hanya sesuai pelatihan dan instruksi petugas.</li></ol></article>
            <article class="emergency-card"><span class="tag">04 / TUMPAHAN</span><h3>Bahan bakar</h3><ol><li>Hentikan pekerjaan dan jauhkan orang dari area.</li><li>Matikan sumber penyalaan jika aman. Jangan menyalakan atau mematikan sakelar di area dengan uap mudah terbakar.</li><li>Beritahu penanggung jawab, ventilasikan area dengan cara aman, dan gunakan spill kit sesuai prosedur. Jangan biarkan masuk ke saluran air.</li></ol></article>
          </div>
        </div>
      </div></section>`);
    }

    function renderQuizInner() {
      const target = $("#quiz-app");
      if (!target) return;
      if (quizFinished) {
        const percent = Math.round((quizScore / DATA.quiz.length) * 100);
        target.innerHTML = `<div class="quiz-result"><div class="eyebrow" style="justify-content:center">Hasil latihan / selesai</div><div class="score">${quizScore}<span style="font-size:.35em;color:var(--ink)">/${DATA.quiz.length}</span></div><h3>${percent >= 80 ? "Dasar K3 kamu kuat." : percent >= 60 ? "Sudah mulai paham." : "Ulangi dan perkuat dasar."}</h3><p>Kamu menjawab benar ${quizScore} dari ${DATA.quiz.length} soal (${percent}%). Baca kembali pembahasan dan coba lagi untuk menguatkan pemahaman.</p><button class="btn btn-primary" data-quiz-retry>Ulangi kuis ${ICONS.arrow}</button></div>`;
        return;
      }
      const question = DATA.quiz[quizIndex];
      const letters = ["A", "B", "C", "D"];
      target.innerHTML = `<div class="quiz-card">
        <div class="quiz-card-top"><span>Soal ${String(quizIndex + 1).padStart(2,"0")} / ${DATA.quiz.length}</span><span>${quizAnswered ? "Jawaban tercatat" : "Pilih satu jawaban"}</span></div>
        <h3>${escapeHtml(question.q)}</h3>
        <div class="quiz-options">${question.options.map((option, index) => {
          let stateClass = "";
          if (quizAnswered && index === question.answer) stateClass = "correct";
          else if (quizAnswered && index === window.lastQuizAnswer && index !== question.answer) stateClass = "incorrect";
          return `<button class="quiz-option ${stateClass}" data-quiz-answer="${index}" ${quizAnswered ? "disabled" : ""}><span class="option-letter">${letters[index]}</span><span>${escapeHtml(option)}</span></button>`;
        }).join("")}</div>
        ${quizAnswered ? `<div class="quiz-feedback ${window.lastQuizAnswer === question.answer ? "" : "wrong"}" aria-live="polite"><strong>${window.lastQuizAnswer === question.answer ? "Benar." : "Belum tepat."}</strong><p>${escapeHtml(question.explanation)}</p></div>` : ""}
        <div class="quiz-actions"><span class="mono" style="font-size:.65rem;color:var(--muted)">Skor sementara: ${quizScore}</span>${quizAnswered ? `<button class="btn btn-primary" data-quiz-next>${quizIndex === DATA.quiz.length - 1 ? "Lihat hasil" : "Soal berikutnya"} ${ICONS.right}</button>` : `<span class="mono" style="font-size:.65rem;color:var(--muted)">Pilih jawaban untuk melihat pembahasan</span>`}</div>
      </div>`;
      const progress = $("#quiz-progress");
      if (progress) progress.innerHTML = DATA.quiz.map((_, i) => `<span class="${i < quizIndex + (quizAnswered ? 1 : 0) ? "done" : ""}"></span>`).join("");
    }
    function renderQuiz() {
      return shell("uji-pemahaman", `${pageHero("06 / Evaluasi", "Uji <em>pemahaman.</em>", "Sepuluh soal pilihan ganda. Setiap jawaban langsung disertai pembahasan singkat agar kamu tahu alasan di baliknya.")}<section class="page-body"><div class="container">
        <div class="quiz-wrap"><aside class="quiz-sidebar"><div class="eyebrow">Kuis K3 bengkel</div><h2>Seberapa<br>siap kamu?</h2><p>Jawab berdasarkan prinsip keselamatan, bukan sekadar menghafal istilah. Tidak ada batas waktu.</p><div class="quiz-progress" id="quiz-progress"></div></aside><div id="quiz-app" aria-live="polite"></div></div>
      </div></section>`);
    }

    function renderProfil() {
      return shell("profil", `${pageHero("07 / Tim penyusun", "Profil <em>kelompok</em>", "")}<section class="page-body"><div class="container">
        <div class="section-heading reveal"><div><div class="eyebrow">Anggota kelompok</div><h2>Tiga orang<br>Satu tujuan</h2></div><p>.</p></div>
        <div class="profile-grid reveal">${DATA.profil.map((person, index) => `<article class="id-card">
          ${imageBlock(ASET.profil[index], `Foto profil ${person.nama}`, "3 / 4", "", "600 × 800 px")}
          <div class="id-copy"><div><span class="id-label">${escapeHtml(person.peran)} / identitas</span><h3>${escapeHtml(person.nama)}</h3></div><div class="nim"><span class="id-label">NIM</span><br>${escapeHtml(person.nim)}</div></div>
        </article>`).join("")}</div>

      </div></section>`);
    }

    function renderPage(shouldScroll = true) {
      const raw = (window.location.hash || "#/beranda").replace(/^#\/?/, "");
      const route = ROUTES.includes(raw) ? raw : "beranda";
      currentRoute = route;
      if (heroTimer) { clearInterval(heroTimer); heroTimer = null; }
      $("#site-nav").innerHTML = navMarkup();
      $("#site-nav").classList.remove("open");
      $("#mobile-menu-toggle").setAttribute("aria-expanded", "false");
      $("#mobile-menu-toggle").setAttribute("aria-label", "Buka menu navigasi");
      $("#mobile-menu-toggle").innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="square"><path d="M3 6h18M3 12h18M3 18h18"/></svg>';
      const app = $("#app");
      if (route === "beranda") app.innerHTML = renderHome();
      else if (route === "apa-itu-k3") app.innerHTML = renderApaItu();
      else if (route === "kenapa-k3-penting") app.innerHTML = renderPenting();
      else if (route === "bahaya-di-bengkel") app.innerHTML = renderBahaya();
      else if (route === "apd") app.innerHTML = renderApd();
      else if (route === "cara-menerapkan-k3") app.innerHTML = renderCaraMenerapkan();
      else if (route === "uji-pemahaman") app.innerHTML = renderQuiz();
      else if (route === "profil") app.innerHTML = renderProfil();
      wireImageFallbacks(app);
      initReveal();
      if (route === "beranda") startHeroSlider();
      if (route === "apd") renderApdDetail();
      if (route === "uji-pemahaman") renderQuizInner();
      if (shouldScroll) window.scrollTo({ top: 0, behavior: prefersReducedMotion ? "auto" : "smooth" });
    }

    function showHero(index) {
      const slides = $$("[data-hero-slide]");
      const dots = $$("[data-hero-dot]");
      if (!slides.length) return;
      heroIndex = (index + slides.length) % slides.length;
      slides.forEach((slide, i) => {
        slide.classList.toggle("active", i === heroIndex);
        slide.setAttribute("aria-hidden", String(i !== heroIndex));
      });
      dots.forEach((dot, i) => {
        dot.classList.toggle("active", i === heroIndex);
        dot.setAttribute("aria-pressed", String(i === heroIndex));
      });
    }
    function startHeroSlider() {
      const stage = $("#hero-stage");
      if (!stage) return;
      let pointerStart = null;
      stage.addEventListener("pointerdown", event => { pointerStart = event.clientX; });
      stage.addEventListener("pointerup", event => {
        if (pointerStart === null) return;
        const delta = event.clientX - pointerStart;
        if (Math.abs(delta) > 45) showHero(heroIndex + (delta < 0 ? 1 : -1));
        pointerStart = null;
      });
      if (!prefersReducedMotion) heroTimer = setInterval(() => showHero(heroIndex + 1), 6500);
    }
    function updateChecklist() {
      const checks = $$("[data-safe-check]");
      const done = checks.filter(input => input.checked).length;
      const percent = Math.round((done / checks.length) * 100);
      const fill = $("#check-progress-fill");
      const text = $("#check-progress-text");
      const percentText = $("#check-progress-percent");
      if (fill) fill.style.width = `${percent}%`;
      if (text) text.textContent = `${done} dari ${checks.length} selesai`;
      if (percentText) percentText.textContent = `${percent}%`;
    }
    function evaluateApdGame() {
      const taskKey = $("#task-select")?.value || "las";
      const task = DATA.tugasApd[taskKey];
      const selected = $$("[data-game-apd]:checked").map(input => input.value);
      const missing = task.required.filter(id => !selected.includes(id));
      const extra = selected.filter(id => !task.required.includes(id));
      const correct = missing.length === 0 && extra.length === 0;
      const names = ids => ids.map(id => DATA.apd.find(item => item.id === id)?.name || id);
      const feedback = $("#game-feedback");
      feedback.className = `game-feedback ${correct ? "" : "error"}`;
      feedback.innerHTML = `<h4>${correct ? "Pilihan tepat." : "Periksa lagi."}</h4><p><b>APD inti:</b> ${escapeHtml(names(task.required).join(", "))}.</p>${missing.length ? `<p><b>Masih kurang:</b> ${escapeHtml(names(missing).join(", "))}.</p>` : ""}${extra.length ? `<p><b>Dipilih tetapi tidak termasuk kombinasi inti skenario:</b> ${escapeHtml(names(extra).join(", "))}. APD tambahan tetap bisa diperlukan setelah penilaian risiko.</p>` : ""}<p>${escapeHtml(task.explanation)}</p>`;
    }

    document.addEventListener("click", event => {
      const toggle = event.target.closest("#mobile-menu-toggle");
      if (toggle) {
        const nav = $("#site-nav");
        const open = nav.classList.toggle("open");
        toggle.setAttribute("aria-expanded", String(open));
        toggle.setAttribute("aria-label", open ? "Tutup menu navigasi" : "Buka menu navigasi");
        toggle.innerHTML = open
          ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m5 5 14 14M19 5 5 19"/></svg>'
          : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="square"><path d="M3 6h18M3 12h18M3 18h18"/></svg>';
        return;
      }
      const prev = event.target.closest("[data-hero-prev]");
      if (prev) { showHero(heroIndex - 1); return; }
      const next = event.target.closest("[data-hero-next]");
      if (next) { showHero(heroIndex + 1); return; }
      const dot = event.target.closest("[data-hero-dot]");
      if (dot) { showHero(Number(dot.dataset.heroDot)); return; }
      const hotspot = event.target.closest("[data-hotspot]");
      if (hotspot) {
        selectedHotspot = hotspot.dataset.hotspot;
        const detail = $("#hotspot-detail");
        if (detail) detail.innerHTML = hazardDetailMarkup(findHazard(selectedHotspot));
        $$("[data-hotspot]").forEach(button => {
          const active = button.dataset.hotspot === selectedHotspot;
          button.classList.toggle("active", active);
          button.setAttribute("aria-pressed", String(active));
        });
        return;
      }
      const filter = event.target.closest("[data-risk-filter]");
      if (filter) {
        const value = filter.dataset.riskFilter;
        $$("[data-risk-filter]").forEach(button => {
          const active = button.dataset.riskFilter === value;
          button.classList.toggle("active", active);
          button.setAttribute("aria-pressed", String(active));
        });
        $$(".hazard-entry").forEach(entry => { entry.hidden = value !== "Semua" && entry.dataset.risk !== value; });
        return;
      }
      const apd = event.target.closest("[data-apd]");
      if (apd) { selectedApd = apd.dataset.apd; renderApdDetail(); return; }
      if (event.target.closest("[data-game-evaluate]")) { evaluateApdGame(); return; }
      const answer = event.target.closest("[data-quiz-answer]");
      if (answer && !quizAnswered) {
        const selected = Number(answer.dataset.quizAnswer);
        window.lastQuizAnswer = selected;
        if (selected === DATA.quiz[quizIndex].answer) quizScore++;
        quizAnswered = true;
        renderQuizInner();
        return;
      }
      if (event.target.closest("[data-quiz-next]")) {
        if (quizIndex < DATA.quiz.length - 1) {
          quizIndex++;
          quizAnswered = false;
          renderQuizInner();
        } else {
          quizFinished = true;
          renderQuizInner();
        }
        return;
      }
      if (event.target.closest("[data-quiz-retry]")) {
        quizIndex = 0; quizScore = 0; quizAnswered = false; quizFinished = false; window.lastQuizAnswer = null;
        renderQuizInner();
      }
    });

    document.addEventListener("change", event => {
      if (event.target.matches("#compare-range")) {
        const comparison = $("#comparison");
        if (comparison) comparison.style.setProperty("--split", `${event.target.value}%`);
      }
      if (event.target.matches("[data-safe-check]")) updateChecklist();
    });
    window.addEventListener("hashchange", () => renderPage(true));
    if (!window.location.hash) window.location.hash = "#/beranda";
    else renderPage(false);
  </script>
</body>
</html>
